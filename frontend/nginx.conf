resolver ${DNS_RESOLVER} valid=10s ipv6=off;

# Preserve standard proxy metadata when an upstream reverse proxy supplies it,
# while still producing useful values for direct HTTP access.
map $http_x_forwarded_proto $atlas_forwarded_proto {
  default $http_x_forwarded_proto;
  "" $scheme;
}

map $http_x_forwarded_host $atlas_forwarded_host {
  default $http_x_forwarded_host;
  "" $host;
}

server {
  listen 80;
  server_name _;
  # Branding accepts a 2 MiB logo plus a 256 KiB favicon. Keep the proxy
  # limit above the API's 3 MiB multipart limit so validation errors are
  # returned as JSON by the backend instead of being intercepted by Nginx.
  client_max_body_size 4m;
  root /usr/share/nginx/html;
  index index.html;

  set $atlas_api tiiv-atlas-api:8080;

  location /api/ {
    proxy_pass http://$atlas_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $atlas_forwarded_host;
    proxy_set_header X-Forwarded-Proto $atlas_forwarded_proto;
  }

  location /health {
    proxy_pass http://$atlas_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $atlas_forwarded_host;
    proxy_set_header X-Forwarded-Proto $atlas_forwarded_proto;
  }

  location / {
    try_files $uri /index.html;
  }
}
