resolver ${DNS_RESOLVER} valid=10s ipv6=off;

server {
  listen 80;
  server_name _;
  # Branding accepts a 2 MiB logo plus a 256 KiB favicon. Keep the proxy
  # limit above the API's 3 MiB multipart limit so validation errors are
  # returned as JSON by the backend instead of being intercepted by Nginx.
  client_max_body_size 4m;
  root /usr/share/nginx/html;
  index index.html;

  set $atlas_api tiiv-atlas-api:8080;

  location /api/ {
    proxy_pass http://$atlas_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /health {
    proxy_pass http://$atlas_api;
  }

  location / {
    try_files $uri /index.html;
  }
}
