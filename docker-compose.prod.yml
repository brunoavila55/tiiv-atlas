services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - atlas-postgres:/var/lib/postgresql/data
      - ./backend/db/migrate.sh:/docker-entrypoint-initdb.d/001-migrate.sh:ro
      - ./backend/db/migrate.sh:/opt/atlas/migrate.sh:ro
      - ./backend/db/migrations:/opt/atlas/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt: ["no-new-privileges:true"]
    networks:
      - atlas-internal
  tiiv-atlas-api:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      APP_BASE_DOMAIN: ${APP_BASE_DOMAIN:-}
      API_PORT: 8080
      ADMIN_NAME: ${ADMIN_NAME:-Atlas Administrator}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    networks:
      - atlas-internal
  tiiv-atlas-web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-15467}:80"
    depends_on:
      tiiv-atlas-api:
        condition: service_healthy
        restart: true
    read_only: true
    tmpfs: ["/etc/nginx/conf.d", "/var/cache/nginx", "/var/run", "/tmp"]
    security_opt: ["no-new-privileges:true"]
    networks:
      - atlas-internal
volumes:
  atlas-postgres:
networks:
  atlas-internal:
